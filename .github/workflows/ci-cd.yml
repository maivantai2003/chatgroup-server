name: chatgroup-server

on:
  push:
    branches: ["vantai"]
  # pull_request:
  #   branches: ["vantai"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checout source code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore chatgroup-server.sln
      - name: Build project
        run: dotnet build chatgroup-server.sln --no-restore --configuration Release
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run tests
        run: dotnet test chatgroup-server.Tests/chatgroup-server.Tests.csproj --configuration Release --verbosity detailed
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/chatgroup-server
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./chatgroup-server
          file: ./chatgroup-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  deploy:
    runs-on: ubuntu-latest
    needs: docker 
    steps:
      - name: Deploy to VPS
        uses: apple/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
              cd /var/www/chatgroup-server
              echo "Stopping and removing old containers..."
              docker compose -f docker-compose.prod.yml down --volumes --remove-orphans
              echo "Pulling latest image..."
              docker compose -f docker-compose.prod.yml pull
              echo "Recreating containers..."
              docker compose -f docker-compose.prod.yml up -d
              echo "Running EF migrations..."
              docker compose -f docker-compose.prod.yml exec api dotnet ef database update
              echo "Cleanup unused images..."
              docker image prune -f
              echo "Deployment completed!"
            
