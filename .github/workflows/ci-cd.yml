name: chatgroup-server

on:
  push:
    branches: ["vantai"]
  pull_request:
    branches: ["vantai"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checout source code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore chatgroup-server.sln
      - name: Build project
        run: dotnet build chatgroup-server.sln --no-restore --configuration Release
      - name: Run tests
        run: dotnet test chatgroup-server.Tests/chatgroup-server.Tests.csproj --no-build --configuration Release --verbosity

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/chatgroup-server
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chatgroup-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
