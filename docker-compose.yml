version: '3.9'
services:
   elasticsearch:
      container_name: els
      image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
      ports:
         - 9200:9200
      volumes:
         - elasticsearch-data:/usr/share/elasticsearch/data
      environment:
           - xpack.security.enabled=false
           - discovery.type=single-node
           - ES_JAVA_OPTS=-Xms512m -Xmx512m
      networks:
         - elastic
   kibana:
      container_name: kibana
      image: docker.elastic.co/kibana/kibana:8.15.0
      ports:
        - 5601:5601
      depends_on:
        - elasticsearch
      environment:
        - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      networks:
        - elastic
   rabbitmq:
      container_name: rabbitmq
      image: rabbitmq:3-management
      ports:
        - 5672:5672
        - 15672:15672
      networks:
        - elastic
   redis:
      container_name: redis
      image: redis:latest
      ports:
         - 6379:6379
      networks:
         - elastic
   sql-server:
      container_name: sql-serverdb
      image: mcr.microsoft.com/mssql/server:2022-latest
      ports:
         - 1433:1433
      environment:
         - ACCEPT_EULA=Y
         - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD}
         - MSSQL_PID=Developer
      volumes:
         - sql_data_chat:/var/opt/mssql
      networks:
         - elastic
      healthcheck:
         test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P $SQL_SA_PASSWORD -Q 'SELECT 1'"]
         interval: 10s
         retries: 10
         start_period: 10s
   chatgroup-server:
      container_name: web-server
      image: chatgroup-server:version-1
      build:
        context: ./chatgroup-server
        dockerfile: Dockerfile
      ports:
        - 5500:80 
      depends_on:
         #  - sql-server
         #  - elasticsearch
         #  - rabbitmq
         #  - redis
         sql-server:
            condition: service_healthy
         elasticsearch:
            condition: service_healthy
         rabbitmq:
            condition: service_started
         redis:
            condition: service_started
      networks:
          - elastic
      environment:
          - ASPNETCORE_ENVIRONMENT=Production
          - ELASTICSEARCH_URL=http://elasticsearch:9200
          - RABBITMQ__HostName=rabbitmq
          - REDIS_HOST=redis
          - ConnectionStrings__DefaultConnection=Server=sql-server,1433;Database=ailo_app;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;
          - ENABLE_SWAGGER=true
          - HEALTHCHECK_HOST=web-server
networks:
   elastic:
       driver: bridge
volumes:
   elasticsearch-data:
   sql_data_chat:
